<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Elecciones JS 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <header class="bg-red-700 text-white p-4 shadow flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold">Simulador Elecciones JS 2026</h1>
      <p class="text-sm opacity-80">Juventud Socialista de Chile</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="downloadData()" class="bg-red-800 hover:bg-red-900 text-white text-sm px-3 py-1 rounded opacity-80 hover:opacity-100">
        ⬇ Descargar
      </button>
      <button onclick="document.getElementById('upload-input').click()" class="bg-red-800 hover:bg-red-900 text-white text-sm px-3 py-1 rounded opacity-80 hover:opacity-100">
        ⬆ Cargar
      </button>
      <input id="upload-input" type="file" accept=".json" class="hidden" onchange="uploadData(event)">
      <button onclick="clearState()" class="bg-red-900 hover:bg-red-950 text-white text-sm px-3 py-1 rounded opacity-80 hover:opacity-100">
        🗑 Borrar datos
      </button>
    </div>
  </header>

  <div class="max-w-7xl mx-auto mt-6 px-4">
    <div class="flex border-b border-gray-300 mb-6">
      <button id="tab-estimado" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-gray-700">
        JS Estimado
      </button>
      <button id="tab-ccn" class="tab-btn px-6 py-3 font-semibold border-b-2 border-red-600 text-red-700">
        Comité Central Nacional <span class="text-xs font-normal">(11 cupos)</span>
      </button>
      <button id="tab-ccr" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-gray-700">
        Comité Central Regional <span class="text-xs font-normal">(30 cupos)</span>
      </button>
      <button id="tab-dir" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-gray-700">
        Dirección
      </button>
    </div>

    <!-- JS Estimado Panel -->
    <div id="panel-estimado" class="hidden">
      <section class="mb-6 bg-white rounded-lg shadow p-4">
        <h2 class="font-bold text-lg mb-1">JS Estimado por Lote</h2>
        <p class="text-xs text-gray-500 mb-3">Estimación de votos JS por región y lote. Los valores son editables y se guardan automáticamente. Sirve para orientar la configuración de listas PS.</p>
        <div class="flex items-center gap-3 mb-4">
          <label class="text-sm font-semibold">Región:</label>
          <select id="je-region-sel" class="border rounded px-3 py-1 text-sm">
            <option value="">— Todas las regiones —</option>
          </select>
        </div>
        <div id="je-container" class="overflow-x-auto"></div>
      </section>
    </div>

    <!-- CCN Panel -->
    <div id="panel-ccn">
      <section class="mb-6 bg-white rounded-lg shadow p-4">
        <h2 class="font-bold text-lg mb-3">Pactos / Listas</h2>
        <div id="ccn-pactos-list" class="flex flex-wrap gap-2 mb-3"></div>
        <div class="flex gap-2">
          <input id="ccn-new-pacto" type="text" placeholder="Nombre del pacto" class="border rounded px-3 py-1 text-sm flex-1">
          <button id="ccn-add-pacto" class="bg-red-600 text-white px-4 py-1 rounded text-sm hover:bg-red-700">+ Agregar Pacto</button>
        </div>
      </section>

      <section class="mb-6 bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-bold text-lg">Candidatos</h2>
          <div id="ccn-cruz-config" class="flex items-center gap-1 flex-wrap text-xs text-gray-400"></div>
        </div>
        <div id="ccn-escenarios-tabs" class="flex items-end gap-0.5 mb-0 border-b border-gray-200"></div>
        <div class="overflow-x-auto pt-2">
          <div id="ccn-cands-header" class="cand-row mb-2 text-xs font-semibold text-gray-500 uppercase"></div>
          <div id="ccn-candidatos-list" class="space-y-0.5 mb-1"></div>
          <div id="ccn-cands-totals"></div>
        </div>
        <!-- Formulario agregar -->
        <div class="relative mb-2">
          <input id="ccn-nombre" type="text" placeholder="Buscar en padrón o escribir nombre..." autocomplete="off"
            class="border rounded px-2 py-1 text-sm w-full">
          <div id="ccn-ac-drop" class="hidden absolute left-0 right-0 bg-white border rounded shadow-lg z-20 max-h-48 overflow-y-auto text-sm"></div>
        </div>
        <div class="flex gap-1 flex-wrap items-center">
          <select id="ccn-pacto-sel" class="border rounded px-1 py-1 text-sm w-32">
            <option value="">— Pacto —</option>
          </select>
          <select id="ccn-lote-sel" class="border rounded px-1 py-1 text-sm w-32">
            <option value="">— Lote —</option>
          </select>
          <input id="ccn-comunal" type="text" placeholder="Comunal" class="border rounded px-1 py-1 text-sm w-24">
          <input id="ccn-vbase"  type="number" min="0" placeholder="V.Base"  class="border rounded px-1 py-1 text-sm w-16">
          <span id="ccn-cruz-add-inputs" class="contents"></span>
          <select id="ccn-sexo" class="border rounded px-1 py-1 text-sm w-24">
            <option value="H">Hombre</option>
            <option value="M">Mujer</option>
          </select>
          <button id="ccn-add-candidato" class="bg-gray-700 text-white px-3 py-1 rounded text-sm hover:bg-gray-800 whitespace-nowrap">
            + Agregar (Enter)
          </button>
        </div>
      </section>

      <section class="mb-6">
        <div class="flex gap-3 mb-4 flex-wrap">
          <button id="ccn-calcular-est" class="bg-red-700 text-white px-5 py-2 rounded font-semibold hover:bg-red-800">
            Calcular
          </button>
        </div>
        <div id="ccn-resultado-output" class="hidden"></div>
      </section>
    </div>

    <!-- CCR Panel -->
    <div id="panel-ccr" class="hidden">
      <div class="mb-4">
        <label class="font-semibold mr-2">Región:</label>
        <select id="ccr-region-sel" class="border rounded px-3 py-2 text-sm"></select>
        <span id="ccr-cupos-badge" class="ml-2 text-sm text-gray-500"></span>
      </div>

      <section class="mb-6 bg-white rounded-lg shadow p-4">
        <h2 class="font-bold text-lg mb-3">Pactos / Listas</h2>
        <div id="ccr-pactos-list" class="flex flex-wrap gap-2 mb-3"></div>
        <div class="flex gap-2">
          <input id="ccr-new-pacto" type="text" placeholder="Nombre del pacto" class="border rounded px-3 py-1 text-sm flex-1">
          <button id="ccr-add-pacto" class="bg-red-600 text-white px-4 py-1 rounded text-sm hover:bg-red-700">+ Agregar Pacto</button>
        </div>
      </section>

      <section class="mb-6 bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-bold text-lg">Candidatos</h2>
          <div id="ccr-cruz-config" class="flex items-center gap-1 flex-wrap text-xs text-gray-400"></div>
        </div>
        <div id="ccr-escenarios-tabs" class="flex items-end gap-0.5 mb-0 border-b border-gray-200"></div>
        <div class="overflow-x-auto pt-2">
          <div id="ccr-cands-header" class="cand-row mb-2 text-xs font-semibold text-gray-500 uppercase"></div>
          <div id="ccr-candidatos-list" class="space-y-0.5 mb-1"></div>
          <div id="ccr-cands-totals"></div>
        </div>
        <div class="relative mb-2">
          <input id="ccr-nombre" type="text" placeholder="Buscar en padrón o escribir nombre..." autocomplete="off"
            class="border rounded px-2 py-1 text-sm w-full">
          <div id="ccr-ac-drop" class="hidden absolute left-0 right-0 bg-white border rounded shadow-lg z-20 max-h-48 overflow-y-auto text-sm"></div>
        </div>
        <div class="flex gap-1 flex-wrap items-center">
          <select id="ccr-pacto-sel" class="border rounded px-1 py-1 text-sm w-32">
            <option value="">— Pacto —</option>
          </select>
          <select id="ccr-lote-sel" class="border rounded px-1 py-1 text-sm w-32">
            <option value="">— Lote —</option>
          </select>
          <input id="ccr-comunal" type="text" placeholder="Comunal" class="border rounded px-1 py-1 text-sm w-24">
          <input id="ccr-vbase"  type="number" min="0" placeholder="V.Base"  class="border rounded px-1 py-1 text-sm w-16">
          <span id="ccr-cruz-add-inputs" class="contents"></span>
          <select id="ccr-sexo" class="border rounded px-1 py-1 text-sm w-24">
            <option value="H">Hombre</option>
            <option value="M">Mujer</option>
          </select>
          <button id="ccr-add-candidato" class="bg-gray-700 text-white px-3 py-1 rounded text-sm hover:bg-gray-800 whitespace-nowrap">
            + Agregar (Enter)
          </button>
        </div>
      </section>

      <section class="mb-6">
        <div class="flex gap-3 mb-4 flex-wrap">
          <button id="ccr-calcular-est" class="bg-red-700 text-white px-5 py-2 rounded font-semibold hover:bg-red-800">
            Calcular
          </button>
          <button id="ccr-calcular-todas" class="bg-gray-600 text-white px-5 py-2 rounded font-semibold hover:bg-gray-700">
            Ver resumen nacional CCR
          </button>
        </div>
        <div id="ccr-resultado-output" class="hidden"></div>
      </section>
    </div>

    <!-- Dirección Panel -->
    <div id="panel-direccion" class="hidden"></div>
  </div>

<script src="js/padron.js"></script>
<script>
// ── data ──────────────────────────────────────────────────────────────────────
const REGIONES = [
  { id:'arica',       nombre:'De Arica',                        cupos:1, padron:138  },
  { id:'tarapaca',    nombre:'De Tarapacá',                     cupos:1, padron:144  },
  { id:'antofagasta', nombre:'De Antofagasta',                  cupos:2, padron:233  },
  { id:'atacama',     nombre:'De Atacama',                      cupos:2, padron:313  },
  { id:'coquimbo',    nombre:'De Coquimbo',                     cupos:1, padron:128  },
  { id:'valparaiso',  nombre:'De Valparaíso',                   cupos:2, padron:293  },
  { id:'rm',          nombre:'Metropolitana de Santiago',        cupos:7, padron:2212 },
  { id:'ohiggins',    nombre:"Del Libertador B. O'Higgins",     cupos:2, padron:163  },
  { id:'maule',       nombre:'Del Maule',                       cupos:2, padron:179  },
  { id:'nuble',       nombre:'De Ñuble',                        cupos:1, padron:154  },
  { id:'biobio',      nombre:'Del BioBío',                      cupos:2, padron:266  },
  { id:'araucania',   nombre:'De La Araucanía',                 cupos:2, padron:196  },
  { id:'losrios',     nombre:'De Los Ríos',                     cupos:1, padron:118  },
  { id:'loslagos',    nombre:'De Los Lagos',                    cupos:2, padron:278  },
  { id:'aysen',       nombre:'De Aysén',                        cupos:1, padron:29   },
  { id:'magallanes',  nombre:'De Magallanes',                   cupos:1, padron:62   },
];
const CCN_CUPOS = 11;
const CCN_VOTOS_ELECTOR = 7;
const CCR_VOTOS_ELECTOR = 4;

function emptyContext() { return { pactos: [], candidatos: [] }; }
function emptyRegionCCR() { return { escenarios: [{ nombre: 'Escenario 1', pactos: [], candidatos: [] }], escenarioActivo: 0 }; }
function emptyRegionCCN() { return { escenarios: [{ nombre: 'Escenario 1', pactos: [], candidatos: [] }], escenarioActivo: 0, cruzNames: ['Cruz.1','Cruz.2','Cruz.3'] }; }
const state = {
  ccn: emptyRegionCCN(),
  ccr: Object.fromEntries(REGIONES.map(r => [r.id, emptyRegionCCR()])),
  ccrRegionActiva: REGIONES[0].id,
  ccrCruzNames: ['Cruz.1','Cruz.2','Cruz.3'],
  jsEstimado: {},
  tabActiva: 'ccn',
  direccion: {
    pactos: [],
    cruzNames: ['Cruz.1','Cruz.2','Cruz.3'],
    presidente:      { candidatos: [] },
    secGeneral:      { candidatos: [] },
    vpMujer:         { candidatos: [] },
    vicepresidencia: { candidatos: [] },
  },
};
function getContext(tipo, regionId) {
  if (tipo === 'ccn') return state.ccn.escenarios[state.ccn.escenarioActivo || 0];
  const rid = regionId != null ? regionId : state.ccrRegionActiva;
  const reg = state.ccr[rid];
  if (!reg) return emptyContext();
  if (reg.escenarios) return reg.escenarios[reg.escenarioActivo || 0];
  return reg;
}
function getCruzNames(tipo) {
  if (tipo === 'ccn') return state.ccn.cruzNames;
  if (tipo === 'ccr') return state.ccrCruzNames;
  return state.direccion.cruzNames;
}
let nextId = 1;
function newId() { return nextId++; }

// ── votos helpers ─────────────────────────────────────────────────────────────
function totalVotos(c) {
  return (parseInt(c.votosBase)||0) + (c.cruces||[]).reduce(function(s,v){return s+(parseInt(v)||0);},0);
}

// ── cruce dynamic helpers ─────────────────────────────────────────────────────
function updateCandRowStyle(panelId, cruzNames) {
  const n = cruzNames.length;
  const cruzCols = new Array(n).fill('58px').join(' ');
  const tpl = '18px minmax(140px,2fr) minmax(90px,1.2fr) minmax(80px,1fr) minmax(70px,1fr) 58px '+cruzCols+' 62px 80px 26px';
  const styleId = 'cand-row-grid-style-'+panelId;
  let el = document.getElementById(styleId);
  if (!el) { el = document.createElement('style'); el.id=styleId; document.head.appendChild(el); }
  el.textContent = '#panel-'+panelId+' .cand-row{grid-template-columns:'+tpl+';}';
}

function renderCandHeader(id, cruzNames) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<span></span><span>Nombre</span><span>Pacto</span><span>Lote</span><span>Comunal</span>'+
    '<span>V.Base</span>'+
    cruzNames.map(function(n){ return '<span>'+n+'</span>'; }).join('')+
    '<span class="font-bold text-gray-700">Total</span><span>Sexo</span><span></span>';
}

function renderCruzConfig(containerId, cruzNames, tipo) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '<span class="whitespace-nowrap text-gray-400 mr-1">Cruces:</span>'+
    cruzNames.map(function(name,i){
      return '<div class="flex items-center gap-0">'+
        '<input class="border rounded px-1 py-0.5 w-20 text-xs" value="'+name+'" '+
          'onchange="window._setCruzName(\''+tipo+'\','+i+',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()">'+
        (cruzNames.length>1
          ? '<button class="text-red-400 hover:text-red-600 text-xs px-0.5 leading-none" onclick="removeCruz(\''+tipo+'\','+i+')" title="Eliminar columna">×</button>'
          : '')+
      '</div>';
    }).join('')+
    '<button class="text-xs text-blue-500 hover:text-blue-700 border border-blue-300 rounded px-1.5 py-0.5 whitespace-nowrap ml-1" onclick="addCruz(\''+tipo+'\')">+ Cruce</button>';
}

function renderCruzAddInputs(pfx, cruzNames) {
  const el = document.getElementById(pfx+'-cruz-add-inputs');
  if (!el) return;
  el.innerHTML = cruzNames.map(function(name,i){
    return '<input id="'+pfx+'-vcruz'+i+'" type="number" min="0" placeholder="'+name+'" class="border rounded px-1 py-1 text-sm w-16">';
  }).join('');
}

function _cruzInlineInputs(c, pfx, ac, enter, updateFn, cruzNames) {
  const cruces = c.cruces || [];
  return cruzNames.map(function(name,i){
    return '<input type="number" class="inline-cell w-full text-center" id="ei-'+pfx+'-vcruz'+i+'-'+c.id+'" value="'+(cruces[i]||0)+'" onchange="'+ac+'" oninput="'+updateFn+'('+c.id+')" onkeydown="'+enter+'">';
  }).join('');
}

function _calcTotalFromInputs(pfx, id, n) {
  const g = function(sel){ const el=document.getElementById(sel); return el?parseInt(el.value)||0:0; };
  let tot = g('ei-'+pfx+'-vbase-'+id);
  for (let i=0;i<n;i++) tot += g('ei-'+pfx+'-vcruz'+i+'-'+id);
  return tot;
}

function _readCruces(pfx, id, n) {
  const arr=[];
  for(let i=0;i<n;i++){const el=document.getElementById('ei-'+pfx+'-vcruz'+i+'-'+id);arr.push(parseInt(el&&el.value)||0);}
  return arr;
}

function _readCruzAddForm(pfx, n) {
  const arr=[];
  for(let i=0;i<n;i++){const el=document.getElementById(pfx+'-vcruz'+i);arr.push(parseInt(el&&el.value)||0);}
  return arr;
}

function _clearCruzAddForm(pfx, n) {
  for(let i=0;i<n;i++){const el=document.getElementById(pfx+'-vcruz'+i);if(el)el.value='';}
}

function addCruz(tipo) {
  const names = getCruzNames(tipo);
  names.push('Cruz.'+(names.length+1));
  _propagateCruzChange(tipo, 'add', null);
  _rebuildAfterCruzChange(tipo);
}

function removeCruz(tipo, idx) {
  const names = getCruzNames(tipo);
  if (names.length<=1) return;
  if (!confirm('¿Eliminar columna "'+names[idx]+'"?\nSe perderán los votos asignados en esa columna.')) return;
  names.splice(idx,1);
  _propagateCruzChange(tipo, 'remove', idx);
  _rebuildAfterCruzChange(tipo);
}

function _propagateCruzChange(tipo, action, idx) {
  const all=[];
  if (tipo==='ccn') {
    state.ccn.escenarios.forEach(function(e){e.candidatos.forEach(function(c){all.push(c);});});
  } else if (tipo==='ccr') {
    REGIONES.forEach(function(r){
      const reg=state.ccr[r.id];
      if(reg&&reg.escenarios) reg.escenarios.forEach(function(e){e.candidatos.forEach(function(c){all.push(c);});});
    });
  } else {
    DIR_CARGOS.forEach(function(cargo){state.direccion[cargo.id].candidatos.forEach(function(c){all.push(c);});});
  }
  all.forEach(function(c){
    if(!c.cruces) c.cruces=[];
    if(action==='add') c.cruces.push(0);
    else if(action==='remove') c.cruces.splice(idx,1);
  });
}

function _renderTotalsEl(elId, candidatos, cruzNames) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!candidatos.length) { el.innerHTML = ''; return; }
  const sumBase = candidatos.reduce(function(s,c){return s+(parseInt(c.votosBase)||0);},0);
  const sumCruces = cruzNames.map(function(_,i){
    return candidatos.reduce(function(s,c){return s+((c.cruces&&c.cruces[i])||0);},0);
  });
  const sumTotal = candidatos.reduce(function(s,c){return s+totalVotos(c);},0);
  el.innerHTML = '<div class="cand-row border-t-2 border-gray-300 py-0.5 bg-gray-50 text-xs font-bold text-gray-600 mb-2">'+
    '<span></span><span class="uppercase tracking-wide text-gray-400">Total</span>'+
    '<span></span><span></span><span></span>'+
    '<span class="text-center">'+sumBase+'</span>'+
    sumCruces.map(function(v){ return '<span class="text-center">'+v+'</span>'; }).join('')+
    '<span class="text-center text-gray-800">'+sumTotal+'</span>'+
    '<span></span><span></span>'+
  '</div>';
}

function _rebuildAfterCruzChange(tipo) {
  const cn = getCruzNames(tipo);
  if (tipo==='ccn') {
    updateCandRowStyle('ccn', cn);
    renderCruzConfig('ccn-cruz-config', cn, 'ccn');
    renderCandHeader('ccn-cands-header', cn);
    renderCruzAddInputs('ccn', cn);
    renderCCNCandidatos();
  } else if (tipo==='ccr') {
    updateCandRowStyle('ccr', cn);
    renderCruzConfig('ccr-cruz-config', cn, 'ccr');
    renderCandHeader('ccr-cands-header', cn);
    renderCruzAddInputs('ccr', cn);
    renderCCRCandidatos(state.ccrRegionActiva);
  } else {
    updateCandRowStyle('direccion', cn);
    DIR_CARGOS.forEach(function(cargo){
      renderCandHeader('dir-cands-header-'+cargo.id, cn);
      renderCruzAddInputs('dir-'+cargo.id, cn);
      renderDirCandidatos(cargo.id);
    });
  }
  saveState();
}

// ── localStorage ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'simulador_js_2026_v2';
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ccn: state.ccn, ccr: state.ccr, ccrCruzNames: state.ccrCruzNames, nextId, jsEstimado: state.jsEstimado, tabActiva: state.tabActiva, ccrRegionActiva: state.ccrRegionActiva, direccion: state.direccion })); } catch(e) {}
}
function migrateCandidate(c) {
  if (c.votosBase === undefined) {
    c.votosBase = c.votos || 0;
  }
  if (!c.cruces) {
    const old = [parseInt(c.vCruz1)||0, parseInt(c.vCruz2)||0, parseInt(c.vCruz3)||0];
    c.cruces = old;
    delete c.vCruz1; delete c.vCruz2; delete c.vCruz3;
  }
  return c;
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!s) return;
    if (s.ccn) {
      if (s.ccn.escenarios) {
        s.ccn.escenarios.forEach(function(e){ e.candidatos=(e.candidatos||[]).map(migrateCandidate); });
        state.ccn = s.ccn;
        if (!state.ccn.cruzNames) state.ccn.cruzNames = ['Cruz.1','Cruz.2','Cruz.3'];
      } else {
        s.ccn.candidatos = (s.ccn.candidatos||[]).map(migrateCandidate);
        state.ccn = { escenarios: [Object.assign({ nombre: 'Escenario 1' }, s.ccn)], escenarioActivo: 0, cruzNames: ['Cruz.1','Cruz.2','Cruz.3'] };
      }
    }
    if (s.ccr) {
      for (const rid of Object.keys(s.ccr)) {
        if (!state.ccr[rid]) state.ccr[rid] = emptyRegionCCR();
        const saved = s.ccr[rid];
        if (saved && saved.escenarios) {
          // New format: migrate candidatos in each scenario
          saved.escenarios.forEach(function(e) { e.candidatos = (e.candidatos||[]).map(migrateCandidate); });
          state.ccr[rid] = saved;
        } else if (saved) {
          // Old format: wrap in first scenario
          saved.candidatos = (saved.candidatos||[]).map(migrateCandidate);
          state.ccr[rid] = { escenarios: [Object.assign({ nombre: 'Escenario 1' }, saved)], escenarioActivo: 0 };
        }
      }
    }

// ── dhondt ────────────────────────────────────────────────────────────────────
function runDhondt(candidatos, pactos, N) {
  const adv = [];
  const vpp = {};
  for (const p of pactos) vpp[p] = 0;
  for (const c of candidatos) { if (vpp[c.pacto] !== undefined) vpp[c.pacto] += c.votos; }
  const total = Object.values(vpp).reduce((a,b) => a+b, 0);
  if (total === 0) return { electos:[], noElectos: candidatos.map(c=>({...c,estado:'no_electo'})),
    cuposPorPacto: Object.fromEntries(pactos.map(p=>[p,0])), cifraRepartidora:0, cocientes:{},
    advertencias:[{tipo:'votos_cero'}], listaUnica:false };

  const listaUnica = pactos.length === 1;
  const cocientes = {};
  for (const p of pactos) { cocientes[p]=[]; for(let k=1;k<=N;k++) cocientes[p].push(vpp[p]/k); }

  let cpp, cr;
  if (listaUnica) {
    cpp = {}; cpp[pactos[0]] = N; cr = null;
  } else {
    const all = pactos.flatMap(p => cocientes[p]).sort((a,b)=>b-a);
    cr = all[N-1];
    cpp = {};
    for (const p of pactos) cpp[p] = Math.floor(vpp[p]/cr);
    let suma = Object.values(cpp).reduce((a,b)=>a+b,0);
    while (suma < N) {
      const cands = pactos.filter(p => Math.abs(vpp[p]/(cpp[p]+1)-cr)<1e-9);
      if (!cands.length) break;
      cands.sort((a,b)=>vpp[b]-vpp[a]);
      if (cands.length>1 && vpp[cands[0]]===vpp[cands[1]]) {
        const g = cands[Math.floor(Math.random()*cands.length)];
        cpp[g]++; adv.push({tipo:'sorteo_dhondt',cupo:suma+1,pactoGanador:g});
      } else { cpp[cands[0]]++; }
      suma++;
    }
  }
  const electos=[], noElectos=[];
  for (const p of pactos) {
    const dp = candidatos.filter(c=>c.pacto===p).sort((a,b)=>b.votos-a.votos);
    const nc = cpp[p]||0;
    for (let i=0;i<dp.length;i++) {
      const c={...dp[i],estado:null,sorteo:false};
      if (i<nc) {
        if (i===nc-1 && dp[i+1] && dp[i].votos===dp[i+1].votos) { c.sorteo=true; c.estado='sorteo'; adv.push({tipo:'sorteo_individual',pacto:p,votos:dp[i].votos}); }
        else c.estado='electo';
        electos.push(c);
      } else { c.estado='no_electo'; noElectos.push(c); }
    }
  }
  return {electos,noElectos,cuposPorPacto:cpp,cifraRepartidora:cr,cocientes,advertencias:adv,listaUnica};
}

// ── parity ────────────────────────────────────────────────────────────────────
function aplicarParidadCCN(electos, noElectos) {
  const N=electos.length, min=Math.ceil(N*0.4);
  let ea=electos.map(c=>({...c})), na=noElectos.map(c=>({...c})), corregido=false;
  const cnt=(a,s)=>a.filter(c=>c.sexo===s).length;
  for(let i=0;i<N*2;i++){
    const nH=cnt(ea,'H'),nM=cnt(ea,'M');
    if(nH>=min&&nM>=min) break;
    const sub=nH<nM?'H':'M', sobre=sub==='H'?'M':'H';
    const pactos=[...new Set(ea.map(c=>c.pacto))];
    const defs=pactos.map(p=>{const d=ea.filter(c=>c.pacto===p);return{pacto:p,deficit:Math.max(0,Math.ceil(d.length*0.4)-d.filter(c=>c.sexo===sub).length)};}).sort((a,b)=>b.deficit-a.deficit);
    let ok=false;
    for(const {pacto} of defs){
      const sal=ea.filter(c=>c.pacto===pacto&&c.sexo===sobre).sort((a,b)=>a.votos-b.votos);
      const ent=na.filter(c=>c.pacto===pacto&&c.sexo===sub).sort((a,b)=>b.votos-a.votos);
      if(sal.length&&ent.length){
        ea=ea.filter(c=>c.id!==sal[0].id); na=na.filter(c=>c.id!==ent[0].id);
        ea.push({...ent[0],estado:'paridad'}); na.push({...sal[0],estado:'no_electo'});
        corregido=true; ok=true; break;
      }
    }
    if(!ok) return {electos:ea,noElectos:na,corregido,imposible:true,advertencias:[]};
  }
  return {electos:ea,noElectos:na,corregido,imposible:false,advertencias:[]};
}

function aplicarParidadCCR(electos, noElectos, padron, cupos) {
  const min=Math.ceil(cupos*0.4);
  const coef=arr=>arr.map(c=>({...c,coeficiente:c.votos/padron}));
  let ea=coef(electos),na=coef(noElectos),corregido=false;
  const cnt=(a,s)=>a.filter(c=>c.sexo===s).length;
  for(let i=0;i<cupos*2;i++){
    const nH=cnt(ea,'H'),nM=cnt(ea,'M');
    if(nH>=min&&nM>=min) break;
    const sub=nH<nM?'H':'M',sobre=sub==='H'?'M':'H';
    const sal=ea.filter(c=>c.sexo===sobre).sort((a,b)=>a.coeficiente-b.coeficiente);
    if(!sal.length) break;
    const s=sal[0];
    const ent=na.filter(c=>c.pacto===s.pacto&&c.sexo===sub).sort((a,b)=>b.coeficiente-a.coeficiente);
    if(ent.length){
      ea=ea.filter(c=>c.id!==s.id); na=na.filter(c=>c.id!==ent[0].id);
      ea.push({...ent[0],estado:'paridad'}); na.push({...s,estado:'no_electo'}); corregido=true;
    } else {
      const otras=[...new Set(ea.filter(c=>c.sexo===sobre&&c.pacto!==s.pacto).map(c=>c.pacto))];
      let found=false;
      for(const p of otras){
        const e=na.filter(c=>c.pacto===p&&c.sexo===sub).sort((a,b)=>b.coeficiente-a.coeficiente);
        const s2=ea.filter(c=>c.pacto===p&&c.sexo===sobre).sort((a,b)=>a.coeficiente-b.coeficiente);
        if(e.length&&s2.length){
          ea=ea.filter(c=>c.id!==s2[0].id); na=na.filter(c=>c.id!==e[0].id);
          ea.push({...e[0],estado:'paridad'}); na.push({...s2[0],estado:'no_electo'}); corregido=true; found=true; break;
        }
      }
      if(!found) return {electos:ea,noElectos:na,corregido,imposible:true};
    }
  }
  return {electos:ea,noElectos:na,corregido,imposible:false};
}

function setupAC(inputId, dropId, getRegion, onSelect) {
  const input = document.getElementById(inputId);
  const drop  = document.getElementById(dropId);
  if (!input || !drop) return;
  input.addEventListener('input', function() {
    const q = this.value.trim().toUpperCase();
    if (q.length < 2 || typeof PADRON_LOOKUP === 'undefined') { drop.classList.add('hidden'); return; }
    const rid = getRegion ? getRegion() : null;
    const pool = rid ? PADRON_LOOKUP.filter(p => p.region === rid) : PADRON_LOOKUP;
    const tokens = q.split(/\s+/).filter(Boolean);
    const matches = pool.filter(p => tokens.every(t => p.nombre.toUpperCase().includes(t))).slice(0, 12);
    if (!matches.length) { drop.classList.add('hidden'); return; }
    drop.innerHTML = matches.map(p =>
      '<div class="px-3 py-1 hover:bg-blue-50 cursor-pointer border-b last:border-0" data-nombre="'+p.nombre+'" data-comunal="'+p.comunal+'" data-sexo="'+p.sexo+'">' +
        '<span class="font-medium">'+p.nombre+'</span> <span class="text-gray-400 text-xs">('+p.comunal+')</span>' +
      '</div>'
    ).join('');
    drop.classList.remove('hidden');
    drop.querySelectorAll('div').forEach(function(div) {
      div.addEventListener('mousedown', function(e) {
        e.preventDefault();
        input.value = div.dataset.nombre;
        drop.classList.add('hidden');
        onSelect({ nombre: div.dataset.nombre, comunal: div.dataset.comunal, sexo: div.dataset.sexo });
      });
    });
  });
  input.addEventListener('blur', function() { setTimeout(function(){ drop.classList.add('hidden'); }, 150); });
}

function calcularCCN() {
  const ctx=getContext('ccn');
  const output=document.getElementById('ccn-resultado-output');
  output.innerHTML=''; output.classList.remove('hidden');
  if(!ctx.pactos.length||!ctx.candidatos.length){output.appendChild(renderBanner('Ingresa al menos un pacto y un candidato.','err'));return;}
  if(ctx.candidatos.some(c=>c.nombre==='(sin nombre)')){output.appendChild(renderBanner('Falta nombre de candidato — edita las filas antes de calcular.','err'));return;}

  const candidatos = ctx.candidatos.map(c=>({...c, votos: totalVotos(c)}));

  const dhondt=runDhondt(candidatos,ctx.pactos,CCN_CUPOS);
  if(dhondt.listaUnica) output.appendChild(renderBanner('Lista única — conteo directo (art. 74)','warn'));
  dhondt.advertencias.forEach(function(a){
    if(a.tipo==='sorteo_dhondt') output.appendChild(renderBanner('⚠ Empate — sorteo cupo N°'+a.cupo+'. Asignado a: '+a.pactoGanador,'warn'));
    if(a.tipo==='sorteo_individual') output.appendChild(renderBanner('⚠ Empate individual pacto '+a.pacto+' ('+a.votos+' votos)','warn'));
  });
  if(!dhondt.listaUnica) output.appendChild(renderDhondtTable(dhondt,ctx.pactos,CCN_CUPOS));

  const par=aplicarParidadCCN(dhondt.electos,dhondt.noElectos);
  if(par.imposible) output.appendChild(renderBanner('⚠ No es posible alcanzar la paridad con los candidatos disponibles.','err'));
  else if(par.corregido) output.appendChild(renderBanner('Se aplicó corrección de paridad (art. 76–77a)','warn'));
  output.appendChild(renderElectos(par.electos,false));
  output.appendChild(renderIndicadorParidad(par.electos,CCN_CUPOS));
}

// ── JS Estimado ───────────────────────────────────────────────────────────────
function initJsEstimado() {
  const lotes = typeof LOTES !== 'undefined' ? LOTES : [];
  for (const r of REGIONES) {
    if (!state.jsEstimado[r.id]) state.jsEstimado[r.id] = {};
    for (const l of lotes) {
      if (state.jsEstimado[r.id][l] === undefined) {
        const base = (typeof ESTIMADO_LOTES !== 'undefined' && ESTIMADO_LOTES[r.id]) || {};
        state.jsEstimado[r.id][l] = base[l] || 0;
      }
    }
  }
}

function buildJsEstimadoTable() {
  const lotes = typeof LOTES !== 'undefined' ? LOTES : [];
  // Poblar selector de región
  const sel = document.getElementById('je-region-sel');
  sel.innerHTML = '<option value="">— Todas las regiones —</option>' +
    REGIONES.map(r => '<option value="'+r.id+'">'+r.nombre+'</option>').join('');
  sel.addEventListener('change', function() { renderJsEstimadoRows(); });

  const container = document.getElementById('je-container');
  container.innerHTML =
    '<table class="text-xs border-collapse w-full">' +
    '<thead><tr class="bg-gray-100">' +
    '<th class="border px-2 py-1 text-left">Región</th>' +
    lotes.map(l => '<th class="border px-2 py-1 text-center">'+l+'</th>').join('') +
    '<th class="border px-2 py-1 text-center font-bold">Total</th>' +
    '</tr></thead>' +
    '<tbody id="je-tbody"></tbody>' +
    '<tfoot id="je-tfoot"></tfoot>' +
    '</table>';
  renderJsEstimadoRows();
}

function renderJsEstimadoRows() {
  const lotes = typeof LOTES !== 'undefined' ? LOTES : [];
  const tbody = document.getElementById('je-tbody');
  if (!tbody) return;
  const filtroId = (document.getElementById('je-region-sel')||{}).value || '';
  const regiones = filtroId ? REGIONES.filter(r => r.id === filtroId) : REGIONES;
  tbody.innerHTML = regiones.map(function(r) {
    const rowTotal = lotes.reduce(function(s,l){ return s + (parseInt(state.jsEstimado[r.id]&&state.jsEstimado[r.id][l])||0); }, 0);
    return '<tr class="hover:bg-gray-50">' +
      '<td class="border px-2 py-1 font-medium whitespace-nowrap">'+r.nombre+'</td>' +
      lotes.map(function(l){
        const val = (state.jsEstimado[r.id]&&state.jsEstimado[r.id][l])||0;
        return '<td class="border p-0"><input type="number" min="0" value="'+val+'" '+
          'class="w-full text-center py-1 px-1 bg-transparent focus:bg-white focus:outline-none" '+
          'onchange="window._jeUpdate(\''+r.id+'\',\''+l+'\',this.value)" '+
          'oninput="window._jeUpdate(\''+r.id+'\',\''+l+'\',this.value)"></td>';
      }).join('') +
      '<td class="border px-2 py-1 text-center font-bold je-row-total-'+r.id+'">'+rowTotal+'</td>' +
    '</tr>';
  }).join('');
  renderJsEstimadoTotals();
}

function renderJsEstimadoTotals() {
  const lotes = typeof LOTES !== 'undefined' ? LOTES : [];
  const tfoot = document.getElementById('je-tfoot');
  if (!tfoot) return;
  const filtroId = (document.getElementById('je-region-sel')||{}).value || '';
  const regiones = filtroId ? REGIONES.filter(r => r.id === filtroId) : REGIONES;
  const colTotals = lotes.map(function(l){
    return regiones.reduce(function(s,r){ return s + (parseInt(state.jsEstimado[r.id]&&state.jsEstimado[r.id][l])||0); }, 0);
  });
  const grandTotal = colTotals.reduce(function(a,b){ return a+b; }, 0);
  tfoot.innerHTML = '<tr class="bg-gray-100 font-bold">' +
    '<td class="border px-2 py-1">Total JS</td>' +
    colTotals.map(function(t){ return '<td class="border px-2 py-1 text-center">'+t+'</td>'; }).join('') +
    '<td class="border px-2 py-1 text-center">'+grandTotal+'</td>' +
    '</tr>';
}

window._jeUpdate = function(regionId, lote, value) {
  if (!state.jsEstimado[regionId]) state.jsEstimado[regionId] = {};
  state.jsEstimado[regionId][lote] = parseInt(value)||0;
  const lotes = typeof LOTES !== 'undefined' ? LOTES : [];
  const rowTotal = lotes.reduce(function(s,l){ return s + (parseInt(state.jsEstimado[regionId]&&state.jsEstimado[regionId][l])||0); }, 0);
  const rowCell = document.querySelector('.je-row-total-'+regionId);
  if (rowCell) rowCell.textContent = rowTotal;
  renderJsEstimadoTotals();
  saveState();
};

function renderCCNScenarios() {

  const s = state.ccn;
  el.innerHTML = s.escenarios.map(function(esc, i) {
    const active = i === (s.escenarioActivo || 0);
    return '<button class="px-3 py-1 text-xs border border-b-0 rounded-t mr-0.5 '+
      (active ? 'bg-white font-semibold text-red-700 border-gray-300' : 'bg-gray-100 text-gray-500 hover:bg-gray-200 border-gray-200')+
      '" onclick="switchCCNScenario('+i+')">'+

      (active ? ' <span class="ml-1 text-gray-400 hover:text-blue-500 cursor-pointer" onclick="event.stopPropagation();renameCCNScenario('+i+')" title="Renombrar">✏</span>' : '') +
      (s.escenarios.length > 1
        ? ' <span class="ml-1 text-gray-400 hover:text-red-500 cursor-pointer" onclick="event.stopPropagation();deleteCCNScenario('+i+')" title="Eliminar">×</span>'
        : '') +
    '</button>';
  }).join('') +
  '<button class="px-2 py-0.5 text-xs text-gray-400 hover:text-gray-700 border border-b-0 rounded-t bg-gray-50 border-gray-200 mr-0.5" onclick="addCCNScenario()" title="Nuevo escenario vacío">＋</button>'+
  '<button class="px-2 py-0.5 text-xs text-blue-400 hover:text-blue-600 border border-b-0 rounded-t bg-gray-50 border-gray-200" onclick="duplicateCCNScenario()" title="Duplicar escenario actual con sus candidatos">⧉ Copiar</button>';
}

function addCCNScenario() {
  const n = state.ccn.escenarios.length + 1;
  state.ccn.escenarios.push({ nombre: 'Escenario ' + n, pactos: [], candidatos: [] });
  state.ccn.escenarioActivo = state.ccn.escenarios.length - 1;
  renderCCNScenarios(); renderCCNPactos(); renderCCNCandidatos(); saveState();
}

function deleteCCNScenario(idx) {
  const s = state.ccn;
  if (s.escenarios.length <= 1) return;
  if (!confirm('¿Eliminar "' + s.escenarios[idx].nombre + '"?')) return;
  s.escenarios.splice(idx, 1);
  if ((s.escenarioActivo || 0) >= s.escenarios.length) s.escenarioActivo = s.escenarios.length - 1;
  renderCCNScenarios(); renderCCNPactos(); renderCCNCandidatos(); saveState();
}

function switchCCNScenario(idx) {
  state.ccn.escenarioActivo = idx;
  renderCCNScenarios(); renderCCNPactos(); renderCCNCandidatos(); saveState();
}

function renameCCNScenario(idx) {
  const n = prompt('Nuevo nombre para el escenario:', state.ccn.escenarios[idx].nombre);
  if (n && n.trim()) { state.ccn.escenarios[idx].nombre = n.trim(); renderCCNScenarios(); saveState(); }
}

function duplicateCCNScenario() {
  const s = state.ccn;
  const src = s.escenarios[s.escenarioActivo || 0];
  const copia = JSON.parse(JSON.stringify(src));
  copia.nombre = src.nombre + ' (copia)';
  copia.candidatos = copia.candidatos.map(function(c) { return Object.assign({}, c, { id: newId() }); });
  s.escenarios.push(copia);
  s.escenarioActivo = s.escenarios.length - 1;
  renderCCNScenarios(); renderCCNPactos(); renderCCNCandidatos(); saveState();
}

function addCCRScenario(regionId) {

// ── Drag & Drop reordering ────────────────────────────────────────────────────
var _drag = { id: null, tipo: null, regionId: null };
window._dragStart = function(e, tipo, regionId, id) {
  _drag = { id: id, tipo: tipo, regionId: regionId };
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
};
window._dragEnd = function(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(function(el){ el.classList.remove('drag-over'); });
};
window._dragOver = function(e, tipo, regionId, id) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (id === _drag.id) return;
  document.querySelectorAll('.drag-over').forEach(function(el){ el.classList.remove('drag-over'); });
  e.currentTarget.classList.add('drag-over');
};
window._drop = function(e, tipo, regionId, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (_drag.id === targetId) return;
  var ctx = tipo === 'dir' ? state.direccion[regionId] : getContext(tipo, regionId);
  var srcIdx = ctx.candidatos.findIndex(function(c){ return c.id === _drag.id; });
  var tgtIdx = ctx.candidatos.findIndex(function(c){ return c.id === targetId; });
  if (srcIdx === -1 || tgtIdx === -1) return;
  var item = ctx.candidatos.splice(srcIdx, 1)[0];
  ctx.candidatos.splice(tgtIdx, 0, item);
  saveState();
  if (tipo === 'ccn') renderCCNCandidatos();
  else if (tipo === 'ccr') renderCCRCandidatos(regionId);
  else renderDirCandidatos(regionId);
};

function calcularDireccion() {
  const output = document.getElementById('dir-resultado-output');
  output.innerHTML = ''; output.classList.remove('hidden');
  const allPactos = state.direccion.pactos;

  for (const cargo of DIR_CARGOS) {
    const sec = document.createElement('div');
    sec.className = 'mb-6 border rounded p-4 bg-white';
    sec.innerHTML = '<h3 class="font-bold text-base mb-3">'+cargo.label+
      ' <span class="text-xs font-normal text-gray-400">('+cargo.cupos+' cupo'+(cargo.cupos>1?'s':'')+')</span></h3>';

    const candidatos = state.direccion[cargo.id].candidatos.map(c=>({...c, votos: totalVotos(c)}));
    const pool = cargo.soloMujer ? candidatos.filter(c=>c.sexo==='M') : candidatos;

    if (!pool.length) {
      sec.appendChild(renderBanner('Sin candidatos'+(cargo.soloMujer?' (mujeres)':'')+' en esta sección.', 'warn'));
      output.appendChild(sec); continue;
    }

    if (cargo.id === 'vicepresidencia') {
      if (!allPactos.length) { sec.appendChild(renderBanner('Ingresa al menos un pacto para calcular Vicepresidencia.', 'err')); output.appendChild(sec); continue; }
      const dhondt = runDhondt(pool, allPactos, cargo.cupos);
      if (dhondt.listaUnica) sec.appendChild(renderBanner('Lista única — conteo directo (art. 74)', 'warn'));
      dhondt.advertencias.forEach(function(a) {
        if (a.tipo==='sorteo_dhondt') sec.appendChild(renderBanner('⚠ Sorteo cupo N°'+a.cupo+' → '+a.pactoGanador, 'warn'));
        if (a.tipo==='sorteo_individual') sec.appendChild(renderBanner('⚠ Empate individual pacto '+a.pacto+' ('+a.votos+' votos)', 'warn'));
      });
      if (!dhondt.listaUnica) sec.appendChild(renderDhondtTable(dhondt, allPactos, cargo.cupos));
      const par = aplicarParidadCCN(dhondt.electos, dhondt.noElectos);
      if (par.imposible) sec.appendChild(renderBanner('⚠ No es posible alcanzar la paridad con los candidatos disponibles.', 'err'));
      else if (par.corregido) sec.appendChild(renderBanner('Se aplicó corrección de paridad', 'warn'));
      sec.appendChild(renderElectos(par.electos, false));
      sec.appendChild(renderIndicadorParidad(par.electos, cargo.cupos));
    } else {
      if (cargo.soloMujer && candidatos.some(c=>c.sexo!=='M')) {
        sec.appendChild(renderBanner('⚠ Se excluyen candidatos hombres (cargo reservado para mujeres).', 'warn'));
      }
      const sorted = [...pool].sort((a,b)=>b.votos-a.votos);
      const electo = {...sorted[0], estado: 'electo'};
      sec.appendChild(renderElectos([electo], false));
    }
    output.appendChild(sec);
  }
}

    '</section>';

  // Wire up pactos
  document.getElementById('dir-add-pacto').addEventListener('click', function() {
    const i = document.getElementById('dir-new-pacto'); if (addDirPacto(i.value)) i.value='';
  });
  document.getElementById('dir-new-pacto').addEventListener('keydown', function(e) {
    if (e.key==='Enter') document.getElementById('dir-add-pacto').click();
  });
  document.getElementById('dir-calcular').addEventListener('click', calcularDireccion);

  // Wire up per-cargo forms and autocomplete
  DIR_CARGOS.forEach(function(cargo) {
    const cid = cargo.id;
    document.getElementById('dir-add-cand-'+cid).addEventListener('click', function(){ doAddDir(cid); });
    document.getElementById('dir-nombre-'+cid).addEventListener('keydown', function(e){ if(e.key==='Enter') doAddDir(cid); });
    setupAC('dir-nombre-'+cid, 'dir-ac-drop-'+cid, null, function(p) {
      document.getElementById('dir-comunal-'+cid).value = p.comunal;
      document.getElementById('dir-sexo-'+cid).value    = p.sexo;
    });
  });

  renderDirPactos();
  DIR_CARGOS.forEach(function(cargo){
    renderCandHeader('dir-cands-header-'+cargo.id, state.direccion.cruzNames);
    renderCruzAddInputs('dir-'+cargo.id, state.direccion.cruzNames);
    renderDirCandidatos(cargo.id);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadState();
buildDireccionPanel();
initJsEstimado();
buildJsEstimadoTable();
renderCCNScenarios();
renderCCNPactos();
renderCCNCandidatos();
if(typeof LOTES!=='undefined'){
  ['ccn-lote-sel','ccr-lote-sel'].forEach(function(id){
    const sel=document.getElementById(id);
    sel.innerHTML='<option value="">— Lote —</option>'+LOTES.map(l=>'<option value="'+l+'">'+l+'</option>').join('');
  });
}
initCCR();
// Restaurar región activa en el selector CCR
document.getElementById('ccr-region-sel').value = state.ccrRegionActiva;
setupAutocompleteCCN();
setupAutocompleteCCR();
updateCandRowStyle('ccn', state.ccn.cruzNames);
updateCandRowStyle('ccr', state.ccrCruzNames);
updateCandRowStyle('direccion', state.direccion.cruzNames);
renderCruzConfig('ccn-cruz-config', state.ccn.cruzNames, 'ccn');
renderCruzConfig('ccr-cruz-config', state.ccrCruzNames, 'ccr');
renderCandHeader('ccn-cands-header', state.ccn.cruzNames);
renderCandHeader('ccr-cands-header', state.ccrCruzNames);
renderCruzAddInputs('ccn', state.ccn.cruzNames);
renderCruzAddInputs('ccr', state.ccrCruzNames);
// Restaurar pestaña activa
switchTab(state.tabActiva || 'ccn');
</script>
